# SonarQube Configuration for Jandig

# Source directories
sonar.sources=src/
sonar.tests=src/

# Test file patterns (within src/)
sonar.test.inclusions=**/tests/**,**/test_*.py,**/ui_tests/**,**/test_settings.py

# Exclusions from analysis (vendor libs + migrations)
sonar.exclusions=**/migrations/**,src/core/static/libs/**

# Coverage exclusions
sonar.coverage.exclusions=**/migrations/**,**/tests/**,**/wsgi.py,**/admin.py,**/asgi.py,**/manage.py,**/ui_tests/**,**/*.js,**/*.jinja2,**/test_settings.py

# Duplication exclusions
sonar.cpd.exclusions=**/migrations/**,src/core/static/libs/**

# Python settings
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml

# JavaScript settings
sonar.javascript.file.suffixes=.js

[jinja2: **/**.jinja2]
encoding = utf-8
babel_style = False

# Password reset email body and subject, rendered by Jinja2 too
[jinja2: **/reset-password/password_reset_email.html]
encoding = utf-8
babel_style = False

[jinja2: **/reset-password/password_reset_subject.txt]
encoding = utf-8
babel_style = False


[extractors]
jinja2 = jinja2.ext:babel_extract